openapi: 3.1.0
info:
  title: employee
  version: "1.0.0"
security:
  - vetisuiteSession: []
paths:
  /api/auth-logout:
    post:
      tags: [employee]
      operationId: auth-logout.create
  /api/clients:
    get:
      tags: [employee]
      operationId: clients.find
      parameters:
        - name: id
          in: query
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
    post:
      tags: [employee]
      operationId: clients.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                phone:
                  type: string
                  minLength: 6
                email:
                  type: [string, "null"]
                  format: email
              required:
                - name
                - phone
    put:
      tags: [employee]
      operationId: clients.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
                  minLength: 2
                phone:
                  type: string
                  minLength: 6
                email:
                  type: [string, "null"]
                  format: email
              required:
                - id
  /api/clients-count:
    get:
      tags: [employee]
      operationId: clients-count.find
      parameters:
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
  /api/clients-patients:
    get:
      tags: [employee]
      operationId: clients-patients.find
      parameters:
        - name: id
          in: query
          schema:
            type: string
            format: uuid
        - name: client
          in: query
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
    post:
      tags: [employee]
      operationId: clients-patients.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client:
                  type: string
                  format: uuid
                name:
                  type: string
                  minLength: 2
                species:
                  type: string
                  enum: [dog, cat, bird, other]
                breed:
                  type: [string, "null"]
                  maxLength: 100
                sex:
                  type: [string, "null"]
                  enum: [male, female]
                birthDate:
                  type: [string, "null"]
                  format: date
              required:
                - client
                - name
                - species
    put:
      tags: [employee]
      operationId: clients-patients.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
                  minLength: 2
                species:
                  type: string
                  enum: [dog, cat, bird, other]
                breed:
                  type: [string, "null"]
                  maxLength: 100
                sex:
                  type: [string, "null"]
                  enum: [male, female]
                birthDate:
                  type: [string, "null"]
                  format: date
              required:
                - id
  /api/files/{path}:
    get:
      tags: [employee]
      operationId: files.find
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
  /api/profile:
    get:
      tags: [employee]
      operationId: profile.find
    put:
      tags: [employee]
      operationId: profile.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                avatar:
                  type: [string, "null"]
                firstName:
                  type: string
                  minLength: 2
                lastName:
                  type: string
                  minLength: 2
                email:
                  type: string
                  format: email
                phone:
                  type: [string, "null"]
              required:
                - firstName
                - lastName
                - email
  /api/profile-email-verification:
    post:
      tags: [employee]
      operationId: profile-email-verification.create
  /api/profile-password:
    put:
      tags: [employee]
      operationId: profile-password.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword:
                  type: string
                  minLength: 1
                password:
                  type: string
                  minLength: 6
                confirmPassword:
                  type: string
                  minLength: 1
              required:
                - currentPassword
                - password
                - confirmPassword
  /api/profile-sessions:
    get:
      tags: [employee]
      operationId: profile-sessions.find
    delete:
      tags: [employee]
      operationId: profile-sessions.remove
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
            format: uuid
  /api/uploads:
    post:
      tags: [employee]
      operationId: uploads.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                size:
                  type: integer
                  minimum: 1
                  maximum: 10485760
                type:
                  type: string
                  maxLength: 255
              required:
                - name
                - size
components:
  securitySchemes:
    vetisuiteSession:
      type: apiKey
      in: cookie
      name: vetisuite_session
      x-httpOnly: true
      x-sameSite: lax
