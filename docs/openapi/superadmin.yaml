openapi: 3.1.0
info:
  title: superadmin
  version: "1.0.0"
security:
  - vetisuiteSession: []
paths:
  /api/files/{path}:
    get:
      tags: [superadmin]
      operationId: files.find
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
  /api/auth-logout:
    post:
      tags: [superadmin]
      operationId: auth-logout.create
  /api/organizations:
    get:
      tags: [superadmin]
      operationId: organizations.find
      parameters:
        - name: id
          in: query
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
  /api/owners-disable:
    put:
      tags: [superadmin]
      operationId: owners-disable.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                disabled:
                  type: boolean
              required: [id, disabled]
  /api/owners-permissions:
    get:
      tags: [superadmin]
      operationId: owners-permissions.find
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
            format: uuid
    put:
      tags: [superadmin]
      operationId: owners-permissions.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                permissions:
                  type: array
                  items:
                    type: string
              required: [id, permissions]
  /api/owners:
    get:
      tags: [superadmin]
      operationId: owners.find
      parameters:
        - name: id
          in: query
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
    post:
      tags: [superadmin]
      operationId: owners.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                organization:
                  type: string
                  format: uuid
                firstName:
                  type: string
                  minLength: 2
                lastName:
                  type: string
                  minLength: 2
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
                phone:
                  type: [string, "null"]
              required: [organization, firstName, lastName, email, password]
    put:
      tags: [superadmin]
      operationId: owners.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                firstName:
                  type: string
                  minLength: 2
                lastName:
                  type: string
                  minLength: 2
                phone:
                  type: [string, "null"]
                description:
                  type: [string, "null"]
                  maxLength: 500
                position:
                  type: [string, "null"]
                occupation:
                  type: [string, "null"]
              required: [id]
  /api/profile-email-verification:
    post:
      tags: [superadmin]
      operationId: profile-email-verification.create
  /api/profile-password:
    put:
      tags: [superadmin]
      operationId: profile-password.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword:
                  type: string
                  minLength: 1
                password:
                  type: string
                  minLength: 6
                confirmPassword:
                  type: string
                  minLength: 1
              required: [currentPassword, password, confirmPassword]
  /api/profile-sessions:
    delete:
      tags: [superadmin]
      operationId: profile-sessions.remove
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
            format: uuid
    get:
      tags: [superadmin]
      operationId: profile-sessions.find
  /api/profile:
    get:
      tags: [superadmin]
      operationId: profile.find
    put:
      tags: [superadmin]
      operationId: profile.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                avatar:
                  type: [string, "null"]
                firstName:
                  type: string
                  minLength: 2
                lastName:
                  type: string
                  minLength: 2
                email:
                  type: string
                  format: email
              required: [firstName, lastName, email]
  /api/superadmins-disable:
    put:
      tags: [superadmin]
      operationId: superadmins-disable.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                disabled:
                  type: boolean
              required: [id, disabled]
  /api/superadmins-permissions:
    get:
      tags: [superadmin]
      operationId: superadmins-permissions.find
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
            format: uuid
    put:
      tags: [superadmin]
      operationId: superadmins-permissions.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                permissions:
                  type: array
                  items:
                    type: string
              required: [id, permissions]
  /api/superadmins:
    get:
      tags: [superadmin]
      operationId: superadmins.find
      parameters:
        - name: id
          in: query
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
    post:
      tags: [superadmin]
      operationId: superadmins.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                  minLength: 2
                lastName:
                  type: string
                  minLength: 2
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
                avatar:
                  type: [string, "null"]
              required: [firstName, lastName, email, password]
    put:
      tags: [superadmin]
      operationId: superadmins.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                firstName:
                  type: string
                  minLength: 2
                lastName:
                  type: string
                  minLength: 2
                avatar:
                  type: [string, "null"]
              required: [id]
  /api/uploads:
    post:
      tags: [superadmin]
      operationId: uploads.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                size:
                  type: integer
                  exclusiveMinimum: 0
                  maximum: 10485760
                type:
                  type: string
                  maxLength: 255
              required: [name, size]
components:
  securitySchemes:
    vetisuiteSession:
      type: apiKey
      in: cookie
      name: vetisuite_session
