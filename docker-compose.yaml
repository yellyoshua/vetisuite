services:
  floci:
    image: floci/floci:latest
    # root: requerido para hablar con el docker.sock y levantar contenedores Lambda
    user: root
    ports:
      - "4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./floci-data:/app/data
    environment:
      FLOCI_STORAGE_MODE: hybrid
      # Lambda: monta server/cloudtasks/ desde el host (sin re-zip en cada cambio)
      FLOCI_SERVICES_LAMBDA_HOT_RELOAD_ENABLED: "true"
      # Los handlers hacen queries a Postgres y llaman a Resend — 3s default insuficiente
      FLOCI_SERVICES_LAMBDA_DEFAULT_TIMEOUT_SECONDS: "30"
