version: 1
applications:
  # ── app.vetisuite.com · SPA React + Vite (sin SSR) ──────────────────────────
  - appRoot: client
    frontend:
      buildPath: /                      # instalar y compilar desde la raíz del monorepo
      phases:
        preBuild:
          commands:
            - nvm install 22 && nvm use 22
            - npm i -g bun@1.3.14       # bun no viene en la imagen AL2023
            - bun --version
            - bun install --frozen-lockfile
        build:
          commands:
            - bun run --filter client build
      artifacts:
        baseDirectory: client/dist      # relativo a buildPath
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*

  # ── vetisuite.com · Astro + astro-aws-amplify ───────────────────────────────
  - appRoot: landing
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm install 22 && nvm use 22   # adapter exige Node >= 22.12
            - npm i -g bun@1.3.14
            - bun --version
            # --linker hoisted: bun 1.3 usa "isolated" en workspaces y el bundle
            # de compute necesita un node_modules plano y real (no symlinks).
            # --filter landing --production: solo deps de landing → límite 220 MB.
            - bun install --frozen-lockfile --linker hoisted --filter landing --production
        build:
          commands:
            - bun run --filter landing build
            # cp (no mv) para no invalidar el cache de node_modules
            - cp -r node_modules landing/.amplify-hosting/compute/default/node_modules
      artifacts:
        baseDirectory: landing/.amplify-hosting
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
